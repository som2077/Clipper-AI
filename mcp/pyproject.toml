[project]
name = "clipper-ai-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Clipper AI — turn long videos into viral short clips."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Clipper AI" }]
keywords = ["mcp", "clipper-ai", "video", "clips", "ai"]
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
clipper-ai-mcp = "supoclip_mcp.server:main"
supoclip-mcp = "supoclip_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supoclip_mcp"]
